<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智慧精密量測實驗室學習世界</title>
<style>
  :root{
    --line: rgba(125,211,252,0.18);
    --sky: #7dd3fc;
    --muted: #b6c3d7;
    --panel: rgba(15,23,42,0.72);
  }
  *{ box-sizing:border-box; }
  html{ background:#0b1728; }
  body{
    margin:0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(37,99,235,0.35), transparent 28%),
      radial-gradient(circle at top right, rgba(6,182,212,0.25), transparent 24%),
      linear-gradient(180deg,#07111f 0%,#0b1728 45%,#111827 100%);
    background-attachment: fixed;
    color:#e5eefc;
  }
  header{ max-width:1120px; margin:0 auto; padding:48px 20px 18px; text-align:center; }
  .lab-logo{
    width:150px; height:150px; margin:0 auto 20px;
    border-radius:50%; overflow:hidden;
    border:3px solid rgba(125,211,252,0.55);
    box-shadow:0 0 42px rgba(34,211,238,0.45), 0 18px 40px rgba(2,6,23,0.6);
  }
  .lab-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:999px;
    background:rgba(37,99,235,0.18); color:var(--sky);
    font-weight:700; font-size:14px; margin-bottom:16px;
  }
  h1{ margin:0; font-size:clamp(30px,5vw,52px); line-height:1.15; letter-spacing:-0.03em; }
  .subtitle{ max-width:680px; margin:16px auto 0; color:var(--muted); font-size:18px; line-height:1.75; }

  .toolbar{ max-width:720px; margin:28px auto 0; padding:0 20px; }
  input{
    width:100%; border:1px solid var(--line); background:rgba(15,23,42,0.78);
    color:#e5eefc; border-radius:16px; padding:15px 18px; font-size:17px; outline:none;
  }
  input::placeholder{ color:#7c8aa1; }
  input:focus{ border-color:rgba(125,211,252,0.75); box-shadow:0 0 0 4px rgba(37,99,235,0.18); }

  main{ max-width:1120px; margin:0 auto; padding:34px 20px 60px; }

  .hint{ text-align:center; color:var(--muted); font-size:16px; margin:0 0 22px; }

  .topics{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
  .topic{
    position:relative; overflow:hidden; text-align:left; cursor:pointer;
    border:1px solid rgba(96,165,250,0.22); border-radius:26px;
    background:var(--panel); color:inherit; font-family:inherit;
    padding:28px 26px 24px; min-height:210px;
    display:flex; flex-direction:column;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .topic::after{
    content:""; position:absolute; inset:auto 0 0 0; height:4px;
    background:linear-gradient(90deg,var(--c1),var(--c2));
  }
  .topic:hover{
    transform:translateY(-6px);
    border-color:rgba(125,211,252,0.7);
    box-shadow:0 0 26px rgba(34,211,238,0.28), 0 24px 48px rgba(2,6,23,0.6);
  }
  .topic .t-icon{
    width:62px; height:62px; border-radius:20px; display:grid; place-items:center;
    font-size:32px; margin-bottom:16px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
  }
  .topic h2{ margin:0 0 8px; font-size:24px; letter-spacing:-0.02em; }
  .topic p{ margin:0; color:var(--muted); font-size:15px; line-height:1.65; flex:1; }
  .topic .t-foot{
    margin-top:16px; display:flex; justify-content:space-between; align-items:center;
    font-size:15px; font-weight:800; color:var(--sky);
  }
  .count{
    background:rgba(148,163,184,0.16); color:#cbd5e1;
    border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700;
  }

  .back{
    display:inline-flex; align-items:center; gap:8px; margin-bottom:18px;
    background:rgba(15,23,42,0.7); border:1px solid rgba(125,211,252,0.28);
    color:#dbeafe; border-radius:999px; padding:10px 18px;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .back:hover{ border-color:rgba(125,211,252,0.7); color:#fff; }

  .list-head{ margin:0 0 20px; }
  .list-head h2{ margin:0 0 6px; font-size:26px; letter-spacing:-0.02em; }
  .list-head span{ color:var(--muted); font-size:15px; }

  .grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
  .card{
    display:flex; flex-direction:column; min-height:200px; padding:22px;
    border-radius:22px; background:var(--panel);
    border:1px solid rgba(96,165,250,0.18);
    box-shadow:0 18px 38px rgba(2,6,23,0.45);
    text-decoration:none; color:inherit;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-5px); border-color:rgba(96,165,250,0.75);
    box-shadow:0 0 24px rgba(34,211,238,0.3), 0 22px 46px rgba(2,6,23,0.7);
  }
  .icon{
    width:44px; height:44px; display:grid; place-items:center; border-radius:14px;
    background:linear-gradient(135deg,rgba(37,99,235,0.28),rgba(6,182,212,0.28));
    font-size:23px; margin-bottom:14px;
  }
  .card h3{ margin:0 0 8px; font-size:19px; line-height:1.4; }
  .card p{ margin:0; color:var(--muted); font-size:15px; line-height:1.65; flex:1; }
  .meta{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    margin-top:16px; color:var(--sky); font-weight:800; font-size:14px;
  }
  .tag{
    color:#cbd5e1; background:rgba(148,163,184,0.16);
    border-radius:999px; padding:5px 10px; font-weight:700; font-size:12px;
  }
  .date{ margin-top:9px; font-size:12px; color:#7c8aa1; }
  .empty{ text-align:center; color:var(--muted); padding:44px 0; font-size:17px; }

  footer{
    text-align:center; color:var(--muted); padding:26px 20px 42px;
    border-top:1px solid var(--line); background:rgba(2,6,23,0.92); line-height:1.8;
  }
  footer a{ color:var(--sky); }
  .hidden{ display:none !important; }

  @media (max-width:900px){
    .topics{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (max-width:640px){
    header{ padding-top:34px; }
    .topics, .grid{ grid-template-columns:1fr; }
    .topic{ min-height:auto; }
    .card{ min-height:auto; }
  }

  .latest{ margin:0 0 30px; }
  .latest-head{ display:flex; align-items:center; gap:10px; margin:0 0 14px; }
  .latest-head h2{ margin:0; font-size:23px; color:#e5eefc; }
  .latest-head span{ color:var(--muted); font-size:14px; }
  .latest-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .latest-card{ display:flex; flex-direction:column; gap:9px; padding:20px 22px; border:1px solid rgba(125,211,252,.28); border-radius:18px; background:linear-gradient(135deg,rgba(14,116,144,.16),rgba(15,23,42,.82)); text-decoration:none; color:#e5eefc; transition:border-color .18s ease,background .18s ease; }
  .latest-card:hover{ border-color:var(--sky); background:rgba(14,116,144,.24); }
  .latest-card:focus-visible{ outline:3px solid var(--sky); outline-offset:4px; }
  .latest-meta{ display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
  .latest-date{ display:inline-block; font-size:14px; font-weight:800; color:#bae6fd; background:rgba(56,189,248,.12); border-radius:7px; padding:4px 10px; font-variant-numeric:tabular-nums; }
  .latest-topic{ color:var(--muted); font-size:13px; }
  .latest-card h3{ margin:0; font-size:18px; line-height:1.5; }
  .latest-card p{ margin:0; color:var(--muted); font-size:14px; line-height:1.65; flex:1; }
  .latest-enter{ color:var(--sky); font-size:14px; font-weight:800; align-self:flex-end; }
  @media(max-width:640px){ .latest-grid{ grid-template-columns:1fr; } .latest-card{ padding:17px 18px; } }
</style>
</head>

const BASE = 'https://tfc02106-cpu.github.io/';
const $ = id => document.getElementById(id);
const hub = $('hub'), detail = $('detail'), results = $('results');

function cardHTML(c){
  const [cat, repo, icon, title, desc, tag, date] = c;
  return '<a class="card" href="' + BASE + repo + '" target="_blank" rel="noopener">' +
    '<div class="icon">' + icon + '</div>' +
    '<h3>' + title + '</h3><p>' + desc + '</p>' +
    '<div class="meta"><span class="tag">' + tag + '</span><span>進入 →</span></div>' +
    '<div class="date">更新：' + date + '</div></a>';
}


const latestCourses = COURSES
  .map((course, index) => ({ course, index }))
  .filter(({ course }) => /^\d{4}-\d{2}-\d{2}$/.test(course[6]))
  .sort((a, b) => b.course[6].localeCompare(a.course[6]) || a.index - b.index)
  .slice(0, 2);
$('latestGrid').innerHTML = latestCourses.map(({ course: c }) => {
  const [cat, repo, icon, title, desc, tag, date] = c;
  const topic = TOPICS.find(t => t.id === cat);
  return '<a class="latest-card" href="' + BASE + repo + '" target="_blank" rel="noopener">' +
    '<div class="latest-meta"><time class="latest-date" datetime="' + date + '">更新：' + date.replaceAll('-', '/') + '</time><span class="latest-topic">' + topic.name + '</span></div>' +
    '<h3>' + icon + ' ' + title + '</h3><p>' + desc + '</p>' +
    '<span class="latest-enter">開啟教材 →</span></a>';
}).join('');

$('topics').innerHTML = TOPICS.map(t => {
  const n = COURSES.filter(c => c[0] === t.id).length;
  return '<button class="topic" data-id="' + t.id + '" style="--c1:' + t.c1 + ';--c2:' + t.c2 + '">' +
    '<div class="t-icon">' + t.icon + '</div>' +
    '<h2>' + t.name + '</h2><p>' + t.desc + '</p>' +
    '<div class="t-foot"><span class="count">' + n + ' 個網頁</span><span>開始學習 →</span></div></button>';
}).join('');

function show(view){
  [hub, detail, results].forEach(s => s.classList.toggle('hidden', s !== view));
}

function openTopic(id){
  const t = TOPICS.find(x => x.id === id);
  $('dTitle').textContent = t.icon + ' ' + t.name;
  $('dDesc').textContent = t.desc;
  $('dGrid').innerHTML = COURSES.filter(c => c[0] === id).map(cardHTML).join('');
  show(detail);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.topic').forEach(b => {
  b.addEventListener('click', () => openTopic(b.dataset.id));
});

$('back').addEventListener('click', () => { show(hub); window.scrollTo({ top: 0, behavior: 'smooth' }); });

$('q').addEventListener('input', e => {
  const k = e.target.value.trim().toLowerCase();
  if (!k) { show(hub); return; }
  const hit = COURSES.filter(c => (c.join(' ') + TOPICS.find(t => t.id === c[0]).name).toLowerCase().includes(k));
  $('rTitle').textContent = '搜尋結果（' + hit.length + '）';
  $('rGrid').innerHTML = hit.map(cardHTML).join('');
  $('rEmpty').classList.toggle('hidden', hit.length > 0);
  show(results);
});
</script>
</body>
</html>

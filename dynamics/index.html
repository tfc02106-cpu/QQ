<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>動力學課程｜簡報下載</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8f2;color:#173334;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.8}main{max-width:760px;margin:60px auto;padding:0 24px}a{color:#087d73}article{margin-top:24px;padding:32px;background:white;border:1px solid #dce5df;border-radius:20px}h1{font-size:32px;margin:0 0 12px}h2{font-size:23px}.meta{color:#627475}button{font:700 18px system-ui;background:#087d73;color:white;border:0;border-radius:12px;padding:16px 26px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:4px}#status{min-height:3.6em;overflow-wrap:anywhere}progress{width:100%;height:12px}small{overflow-wrap:anywhere}@media(max-width:600px){main{margin-top:28px}article{padding:24px}h1{font-size:28px}}</style></head>
<body><main><a href="../">← 回到學習世界首頁</a><article><h1>動力學課程</h1><p class="meta">課程簡報下載｜更新：2026/10/06</p><h2>第 2 章｜第 2-1 至 2-3 節</h2><p>整合版（106）・176 張投影片・PowerPoint（19.7 MB）</p><p>下載後使用 PowerPoint 開啟，即可閱讀課堂簡報。</p><button id="download" type="button">下載 PPT</button><p id="status" role="status" aria-live="polite">點選按鈕開始下載。</p><progress id="progress" max="3" value="0" hidden aria-label="下載進度"></progress><small>檔名：動力學_第2章_2-1至2-3_整合版 (106).pptx</small></article></main>
<script>
const button=document.getElementById('download'),status=document.getElementById('status'),progress=document.getElementById('progress');
button.addEventListener('click',async()=>{
 button.disabled=true;progress.hidden=false;progress.value=0;status.textContent='正在準備簡報，請稍候…';
 try{
  const parts=[];
  for(let i=1;i<=3;i++){
   const response=await fetch('files/dynamics-ch2-v106.part'+i);
   if(!response.ok)throw new Error('HTTP '+response.status);
   parts.push(await response.arrayBuffer());progress.value=i;
   status.textContent='正在下載簡報（'+Math.round(i/3*100)+'%）…';
  }
  const blob=new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
  if(blob.size!==19738808)throw new Error('檔案大小不符');
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hash!=='32c8315e4b21cc576d4657200b146ee2e0cd9ce448f9e597d0c24be74aeaefdf')throw new Error('檔案完整性檢查未通過');
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='動力學_第2章_2-1至2-3_整合版 (106).pptx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  status.textContent='簡報已準備完成，請查看瀏覽器的下載項目。';
 }catch(error){status.textContent='下載未完成，請稍後再按「下載 PPT」重試。';console.error(error);}
 finally{button.disabled=false;}
});
</script></body></html>

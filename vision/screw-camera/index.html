<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手機螺絲辨識</title>
<style>*{box-sizing:border-box}body{margin:auto;max-width:38rem;padding:1.5rem;font:1rem/1.6 system-ui;color:#173334;background:#f7f8f2}a{color:#086b61}input,button{font:inherit;padding:.65rem;border:1px solid #9baaa6;border-radius:.5rem}input{width:100%;margin:.4rem 0 1rem}button{background:#126a60;color:white}button:disabled{opacity:.5}video{width:100%;aspect-ratio:1;object-fit:cover;background:#182c30;border-radius:1rem}video[hidden]{display:none}output{font-size:1.4rem;font-weight:bold}</style>
<a href="../../">← 學習世界首頁</a><h1>手機螺絲辨識</h1>
<p>將一顆螺絲置於畫面中央，觀察模型判定的類別與分數。</p>
<label>Teachable Machine 模型網址<input id="url" type="url" value="https://teachablemachine.withgoogle.com/models/uvBbqgOIs/"></label>
<button id="start">啟動後鏡頭</button> <button id="stop" disabled>停止辨識</button>
<p id="status" role="status"></p><video id="video" muted playsinline hidden></video><output id="result" aria-live="off"></output>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<script>
const el = id => document.getElementById(id);
const video = el('video');
let session = 0;
let model;
let loadedURL;
function stopCamera() {
  session++;
  if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
  video.srcObject = null;
  video.hidden = true;
  el('result').textContent = '';
  el('start').disabled = false;
  el('stop').disabled = true;
  el('url').disabled = false;
  el('status').textContent = '辨識已停止。';
}
el('stop').onclick = stopCamera;
window.addEventListener('pagehide', stopCamera);
el('start').onclick = async () => {
  const ticket = ++session;
  const url = el('url').value.trim().replace(/\/+$/, '') + '/';
  if (!/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[\w-]+\/$/.test(url)) {
    el('status').textContent = '請貼上 TensorFlow.js 匯出時取得的模型網址。';
    return;
  }
  el('url').disabled = el('start').disabled = true;
  let hint = '模型載入失敗，請確認模型網址及網路連線。';
  try {
    el('status').textContent = '載入模型中…';
    if (loadedURL !== url) {
      model = await tmImage.load(url + 'model.json', url + 'metadata.json');
      loadedURL = url;
    }
    if (ticket !== session) return;
    hint = '無法啟動相機，請允許瀏覽器使用相機後重試。';
    el('status').textContent = '請允許使用相機。';
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if (ticket !== session) { stream.getTracks().forEach(track => track.stop()); return; }
    video.srcObject = stream;
    await video.play();
    if (ticket !== session) return;
    video.hidden = false;
    el('stop').disabled = false;
    el('status').textContent = '即時辨識中';
    hint = '辨識中斷，請重新啟動。';
    while (ticket === session) {
      const predictions = await model.predict(video);
      if (ticket !== session) return;
      const best = predictions.reduce((a,b) => a.probability > b.probability ? a : b);
      el('result').textContent = best.className + '　' + (best.probability * 100).toFixed(1) + '%';
      await new Promise(resolve => setTimeout(resolve, 160));
    }
  } catch (error) {
    if (ticket === session) { stopCamera(); el('status').textContent = hint; }
  }
};
</script></html>
